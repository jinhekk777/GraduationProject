<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木构院落</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D stage; mode switch top-left, info card left, tour dock bottom; hall labels float over the 3D */
  --bg:#0f1218;
  --panel:rgba(16,19,25,.72);
  --line:rgba(236,228,214,.16);
  --paper:#ece4d6;
  --muted:#a8a091;
  --accent:#d0a46a;
  --accent-ink:#2a1a0c;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3em;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{padding:7px 13px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{color:var(--paper);background:rgba(208,164,106,.16);box-shadow:inset 0 -2px 0 var(--accent)}
.card{position:absolute;top:62px;left:max(16px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 32px));padding:14px 16px}
.card .k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.card .head{display:flex;align-items:flex-start;gap:10px}
.card .head > div{flex:1;min-width:0}
.card .tog{flex:none;margin:-4px -6px 0 0;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);display:flex;align-items:center;gap:4px;min-height:32px}
.card .tog:hover{color:var(--paper)}
.card .tog svg{transition:transform .2s}
.card.collapsed{width:auto;max-width:min(330px,calc(100% - 32px));padding:9px 12px}
.card.collapsed h2{margin:0;font-size:16px}
.card.collapsed .tog svg{transform:rotate(180deg)}
.card.collapsed #cardBody{display:none}
#cardBody{max-height:min(46vh,420px);overflow:auto}
.card h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.08em;margin:2px 0 8px}
.card p{margin:0 0 8px;font-size:13.5px;line-height:1.75}
.card ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--paper)}
.card .note{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:8px;line-height:1.6}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12.5px;padding:4px 9px;border-radius:999px;background:rgba(16,19,25,.78);border:1px solid rgba(208,164,106,.6);color:var(--paper)}
.lab b{color:var(--accent);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
.lab[hidden]{display:none}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:10px;padding:8px 12px;width:max-content;max-width:calc(100% - 32px);justify-content:center}
.dock[hidden]{display:none}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots button{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.seg.small button{padding:6px 10px;font-size:12.5px}
.dots button[aria-current="true"]{border-color:var(--accent);color:var(--paper)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-family:var(--display);letter-spacing:.3em;color:var(--muted);transition:opacity .7s}
.loading.done{opacity:0;pointer-events:none}
.ld{width:min(340px,72vw);letter-spacing:0}
.ld svg{display:block;width:100%;overflow:visible}
.ld .w1{fill:#c79a66;stroke:#2b2118;stroke-width:1.6;stroke-linejoin:round}
.ld .w2{fill:#9c6a40;stroke:#2b2118;stroke-width:1.6;stroke-linejoin:round}
.ld .gr{fill:none;stroke:#2b2118;stroke-width:.7;opacity:.28;stroke-linecap:round}
#ldPin{fill:#d8b25a;stroke:#2b2118;stroke-width:1.2;opacity:0;transform-origin:200px 60px;transform:scale(.2);transition:opacity .35s,transform .35s}
.loading.joined #ldPin{opacity:1;transform:scale(1)}
.ld-bar{height:2px;background:rgba(43,33,24,.16);margin-top:18px;border-radius:2px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:#8a3b2a}
.ld-bar{position:relative}
.ld-bar::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,244,220,.75),transparent);animation:ldSheen 1.6s linear infinite;will-change:transform}
@keyframes ldSheen{from{transform:translateX(-100%)}to{transform:translateX(430%)}}
@media (prefers-reduced-motion:reduce){.ld-bar::after{animation:none;display:none}}
.ld-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-family:var(--display);color:var(--muted);font-size:15px}
#ldMsg{letter-spacing:.4em}
#ldPct{font-variant-numeric:tabular-nums;letter-spacing:.05em}
@media (max-width:760px){
  .dock{flex-wrap:wrap}
  .card h2{font-size:17px}
  #cardBody{max-height:30vh}
  .card p{font-size:12.5px}
  .lab{font-size:11px;padding:3px 7px}
}
.walkbar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:12px;padding:8px 12px;width:max-content;max-width:calc(100% - 32px);font-size:13px;color:var(--muted)}
.walkbar[hidden]{display:none}
.walkbar b{color:var(--paper);font-weight:500}
.touch-hint{display:none}
.stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:84px;width:120px;height:120px;border-radius:50%;background:rgba(16,19,25,.35);border:1px solid var(--line);touch-action:none;display:none}
.stick .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(236,228,214,.28);border:1px solid rgba(236,228,214,.5)}
@media (pointer:coarse){ .kbd-hint{display:none} .touch-hint{display:inline} .stick:not([hidden]){display:block} }
.colophon{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:72px;display:flex;align-items:flex-start;gap:8px;pointer-events:none;opacity:.86}
.colophon .ins{writing-mode:vertical-rl;font-family:var(--display);font-size:17px;letter-spacing:.35em;color:rgba(40,28,20,.78);line-height:1.6}
.colophon .seal{display:grid;place-items:center;width:34px;padding:4px 0;border:2px solid rgba(170,40,30,.85);color:rgba(170,40,30,.9);font-family:var(--display);font-weight:700;font-size:13px;line-height:1.1;background:rgba(190,50,35,.08);border-radius:3px}
@media (max-width:760px){ .colophon{display:none} }
@media (prefers-reduced-motion:reduce){.loading{transition:none}}
</style>

<div id="app">
  <canvas id="scene" aria-label="木构院落三维模型"></canvas>
  <div class="labels" id="labels"></div>
  <header class="top">
    <span class="brand">木构院落</span>
    <div class="seg" id="modes" role="group" aria-label="观看方式">
      <button data-mode="ext" aria-pressed="true">外观</button>
      <button data-mode="cut" aria-pressed="false">剖视布局</button>
      <button data-mode="tour" aria-pressed="false">馆内漫游</button>
      <button data-mode="walk" aria-pressed="false">自由行走</button>
    </div>
    <div class="seg small" id="times" role="group" aria-label="时间" hidden style="display:none"></div>
  </header>
  <section class="card panel" aria-live="polite" hidden style="display:none">
    <div class="head">
      <div><div class="k" id="cardK">外观</div><h2 id="cardT">以榫卯造一座院落</h2></div>
      <button class="tog" id="cardTog" aria-expanded="true" aria-controls="cardBody"><span id="cardTogT">收起</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="cardBody">
      <p id="cardP"></p>
      <ul id="cardL"></ul>
      <div class="note" id="cardN"></div>
    </div>
  </section>
  <nav class="dock panel" id="tourDock" aria-label="漫游" hidden>
    <button class="btn" id="prev">上一处</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="next">下一处</button>
  </nav>
  <div class="walkbar panel" id="walkBar" hidden>
    <span class="kbd-hint"><b>W A S D</b> / <b>↑ ↓</b> 走动 · <b>← →</b> 或拖动画面 转身 · <b>Shift</b> 快走</span>
    <span class="touch-hint">左下摇杆走动 · 拖动画面转身</span>
    <button class="btn" id="walkHome">回到山门</button>
  </div>
  <div class="stick" id="stick" hidden aria-hidden="true"><div class="knob" id="stickKnob"></div></div>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="ld">
      <svg viewBox="-40 0 370 120" aria-hidden="true">
        <g id="ldMao"><path class="w2" d="M170 20H290V100H170V75H230V45H170Z"/><path class="gr" d="M180 32H282M238 52H284M240 68H282M178 88H284"/></g>
        <g id="ldSun"><path class="w1" d="M50 20H170V45H230V75H170V100H50Z"/><path class="gr" d="M58 32H162M56 52H222M60 68H224M58 88H160"/></g>
        <circle id="ldPin" cx="200" cy="60" r="4.5"/>
      </svg>
      <div class="ld-bar"><i id="ldFill"></i></div>
      <div class="ld-row"><span id="ldMsg">取料</span><span id="ldPct">0%</span></div>
    </div>
  </div>
</div>

/* ---------- 镇馆展品: a full-size Tang bracket set on its column, a cut-away model of the Yingxian pagoda beside its survey drawing,
